# Server Port (Render injects PORT)
server.port=${PORT:8080}

# Database Configuration:
# If SPRING_DATASOURCE_URL is supplied (e.g. cloud MySQL/Postgres), it connects to it.
# Otherwise, it falls back to an embedded H2 database so the backend starts instantly without crashing!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartcampus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Hibernate / JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

